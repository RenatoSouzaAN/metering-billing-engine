name: metering-billing-engine

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - 5435:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
